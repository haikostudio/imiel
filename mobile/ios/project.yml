# Projet Xcode de l'application iPhone iMiel, genere par XcodeGen
# (`cd mobile/ios && xcodegen generate`) : rien de genere n'est versionne.
#  - App     : coquille Capacitor qui charge https://imiel.example.com
#              (studio.haiko.imiel), notifications APNs natives.
#  - Widgets : extension WidgetKit (studio.haiko.imiel.Widgets), iOS 17+.
# Partage app <-> widgets par le TROUSSEAU (keychain-access-groups), jamais par
# un App Group (refuse par les profils crees par cle d'API).
# Signature MANUELLE : certificat Apple Distribution d'equipe (CERT000001) et
# un profil IOS_APP_STORE par cible, poses par .github/workflows/mobile-ios.yml.
name: iMiel
options:
  bundleIdPrefix: studio.haiko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    DEVELOPMENT_TEAM: ABCDE12345
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  Capacitor:
    url: https://github.com/ionic-team/capacitor-swift-pm.git
    exactVersion: 8.6.2

schemes:
  App:
    build:
      targets:
        App: all
        Widgets: all
    archive:
      config: Release

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "public"
          - "public/**"
      - path: App/public
        type: folder
      - path: Shared
    dependencies:
      - target: Widgets
      - package: Capacitor
        product: Capacitor
      - package: Capacitor
        product: Cordova
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iMiel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: studio.haiko.imiel
            CFBundleURLSchemes:
              - imiel
        ITSAppUsesNonExemptEncryption: false
        HaikoKeychainGroup: $(AppIdentifierPrefix)studio.haiko.imiel.shared
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: App/App.entitlements
      properties:
        aps-environment: production
        keychain-access-groups:
          - $(AppIdentifierPrefix)studio.haiko.imiel.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.haiko.imiel
        PRODUCT_NAME: iMiel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: "NO"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "iMiel App Store"

  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: iMiel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        HaikoKeychainGroup: $(AppIdentifierPrefix)studio.haiko.imiel.shared
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)studio.haiko.imiel.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.haiko.imiel.Widgets
        PRODUCT_NAME: iMielWidgets
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "iMiel Widgets App Store"
