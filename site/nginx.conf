server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # aucun journal d'acces : la page Confidentialite annonce au plus 14 jours de garde
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location /assets/ { expires 30d; add_header Cache-Control "public, max-age=2592000"; }
  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
}
