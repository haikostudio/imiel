# App web iMiel Cloud (app.getimiel.com) : interface statique ; la base vit
# dans le navigateur, aucune donnee de mail ne passe par ce serveur.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://sync.getimiel.com wss://sync.getimiel.com; frame-ancestors 'none'" always;
  location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri.html $uri/ /index.html; }
}
